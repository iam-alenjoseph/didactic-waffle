[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-diffusion-unreal"
version = "1.0.0"
description = "Generative Diffusion Model for Video using DDPM and Hugging Face UNets with Unreal Engine 5 Multimodal Data Collection"
readme = "README.md"
authors = [
    { name = "Research Collaboration (Google DeepMind & ASU)" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-image>=0.21.0",
    "pillow>=9.5.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "diffusers>=0.25.0",
    "accelerate>=0.26.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

